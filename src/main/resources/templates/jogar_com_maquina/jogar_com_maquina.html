<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Munchkin da Casa — Jogar com a máquina</title>
    <link rel="stylesheet" th:href="@{/css/mesa/mesa.css}">
</head>
<body>
<!--/* data-bots-jogam: só na preparação; o bots_jogam.js pergunta por ali se um bot usa carta */-->
<main class="mesa" th:attr="data-distribuindo=${distribuindo},
        data-bots-jogam=${rodada.preparacao} ? @{/jogar-com-maquina/{id}/bots/jogar(id=${partidaId})}">
    <section th:replace="~{mesa/mesa :: pilhas}"></section>
    <p th:replace="~{mesa/mesa :: vitoria(${vitoria})}"></p>
    <section th:replace="~{mesa/mesa :: rodada(${rodada},
            @{/jogar-com-maquina/{id}/pronto(id=${partidaId})}, ${comecou})}"></section>
    <ol th:replace="~{mesa/mesa :: oponentes(${oponentes})}"></ol>
    <section th:replace="~{mesa/mesa :: placar(${oponentes})}"></section>
    <section th:replace="~{mesa/mesa :: historico(${historico})}"></section>
    <dl th:replace="~{mesa/mesa :: infoDoJogador(${jogador}, ${podeVenderOuro},
            @{/jogar-com-maquina/{id}/vender-ouro(id=${partidaId})})}"></dl>
    <p th:replace="~{mesa/mesa :: aviso(${aviso})}"></p>
    <th:block th:replace="~{mesa/mesa :: usoDeCarta(${oponentes}, ${opcoesDeUso},
            @{/jogar-com-maquina/{id}/usar-carta(id=${partidaId})})}"></th:block>
    <details th:replace="~{mesa/mesa :: cartasDeTeste(${cartasDeTeste},
            @{/jogar-com-maquina/{id}/teste/pegar-carta(id=${partidaId})}, ${grupoDeTeste})}"></details>
    <th:block th:replace="~{mesa/mesa :: maoDoJogador(${jogador}, ${mao}, ${usos},
            @{/jogar-com-maquina/{id}/mao(id=${partidaId})})}"></th:block>
</main>
<script th:src="@{/js/mesa/compra_inicial.js}"></script>
<script th:src="@{/js/mesa/organizar_mao.js}"></script>
<script th:src="@{/js/mesa/usar_carta.js}"></script>
<script th:src="@{/js/mesa/provocar.js}"></script>
<script th:src="@{/js/jogar_com_maquina/bots_provocam.js}"></script>
<script th:src="@{/js/jogar_com_maquina/bots_jogam.js}"></script>
</body>
</html>
