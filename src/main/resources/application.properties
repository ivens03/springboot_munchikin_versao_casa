spring.application.name=versao.casa.munchkin

# PostgreSQL (container do compose.yaml)
spring.datasource.url=jdbc:postgresql://localhost:5432/munchkin
spring.datasource.username=postgresql
spring.datasource.password=postgresql

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Porta
server.port=8484